name: Обновить данные и опубликовать сайт

on:
  schedule:
    - cron: "7 * * * *"   # каждый час, в 7 минут (так меньше очередь у GitHub)
  push:
    branches: [main]
  workflow_dispatch:       # кнопка «Run workflow» вручную

permissions:
  contents: write   # чтобы закоммитить свежие данные
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Проверить расчёты
        run: |
          python -m unittest discover -s tests -p "test_*.py"
          node --test tests/rebalance.test.js

      - name: Обновить данные (цены, капитализация, история)
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: python scripts/update_data.py --mode auto

      - name: Сохранить данные в репозитории
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "Данные не изменились"
          else
            git commit -m "Обновление данных"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v4
